[project]
name = "llm-kg-completion"
version = "0.1.0"
description = "LLM-Assisted Knowledge Graph Completion for Curriculum Analysis"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "neo4j>=5.0.0",
    "litellm>=1.0.0",
    "llama-index-core>=0.13.0",
    "llama-index-llms-litellm>=0.4.0",
    "llama-index-embeddings-litellm>=0.2.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    "pypdf2>=3.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]
